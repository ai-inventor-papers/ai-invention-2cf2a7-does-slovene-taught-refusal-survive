entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.lock.txt"
  - path: gpu/.venv/
    delete: regenerable
    source: "cd gpu && uv sync --frozen"
  - path: src/__pycache__/
    delete: regenerable
    source: ".venv/bin/python eval.py"
  - path: tests/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m pytest -q"
  - path: .pytest_cache/
    delete: regenerable
    source: ".venv/bin/python -m pytest -q"
