[project]
name = "slovene-refusal-rescoring"
version = "0.1.0"
description = "Re-scoring saved exp14/exp15 replies for harmful content and refusal-judge validity (SCREEN)"
requires-python = ">=3.12,<3.13"
# direct dependencies, pinned to the versions installed in .venv (full transitive pin list: requirements.lock.txt)
# torch is the CUDA 12.8 build: install with --index-url https://download.pytorch.org/whl/cu128
dependencies = [
    "accelerate==1.15.0",
    "aiohttp==3.14.3",
    "loguru==0.7.3",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "openai==3.19.2",
    "pandas==3.0.6",
    "peft==0.21.0",
    "psutil==7.2.2",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "sacrebleu==2.6.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "sentencepiece==0.2.2",
    "statsmodels==0.15.0",
    "tenacity==9.1.4",
    "torch==2.8.0+cu128",
    "transformers==4.49.0",
]
