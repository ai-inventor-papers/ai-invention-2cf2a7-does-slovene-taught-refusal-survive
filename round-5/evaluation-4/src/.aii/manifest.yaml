entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.lock.txt"
  - path: src/__pycache__/
    delete: regenerable
    source: "created automatically by python on import"
  - path: tests/__pycache__/
    delete: regenerable
    source: "created automatically by pytest"
  - path: .pytest_cache/
    delete: regenerable
    source: ".venv/bin/python -m pytest -q"
