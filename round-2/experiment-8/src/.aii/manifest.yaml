entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -r requirements.lock.txt"
  - path: src/__pycache__/
    delete: regenerable
    source: "python bytecode cache, recreated automatically on import (python -m compileall src)"
  - path: tests/__pycache__/
    delete: regenerable
    source: "python bytecode cache, recreated automatically on import (python -m compileall tests)"
  - path: .pytest_cache/
    delete: regenerable
    source: ".venv/bin/python -m pytest -c pytest.ini tests/"
