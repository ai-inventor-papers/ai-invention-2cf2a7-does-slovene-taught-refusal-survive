entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.txt"
  - path: src/__pycache__/
    delete: regenerable
    source: "python bytecode cache; recreated on the next run of run_all.sh"
  - path: vendor/__pycache__/
    delete: regenerable
    source: "python bytecode cache; recreated on the next run of run_all.sh"
