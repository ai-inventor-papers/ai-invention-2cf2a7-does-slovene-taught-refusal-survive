entries:
  - path: .venv/
    delete: regenerable
    source: "uv sync   # or: uv venv .venv --python 3.12 && uv pip install -r requirements.lock.txt"
  - path: src/__pycache__/
    delete: regenerable
    source: "recreated automatically on the next run of any src/*.py"
  - path: tests/__pycache__/
    delete: regenerable
    source: "uv run pytest -c pytest.ini tests/"
  - path: .pytest_cache/
    delete: regenerable
    source: "uv run pytest -c pytest.ini tests/"
