entries:
  - path: .venv/
    delete: regenerable
    source: "./restore.sh  # or: uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python pandas==3.0.6 pyarrow==25.0.1 numpy==2.5.3 scipy==1.18.1 statsmodels==0.15.0 scikit-learn==1.9.1 aiohttp==3.14.3 sacrebleu==2.6.0 transformers==4.57.6 torch==2.14.0 sentencepiece==0.2.2 loguru==0.7.3 PyYAML==6.0.3 protobuf==7.36.2 matplotlib==3.11.2 tenacity==9.1.4 psutil==7.2.2"

  - path: src/__pycache__/
    delete: regenerable
    source: "python bytecode cache; CPython rewrites it on the next import, e.g. cd src && ../.venv/bin/python -c 'import common, engine, readout'"

  - path: vendor/exp9/__pycache__/
    delete: regenerable
    source: "python bytecode cache; CPython rewrites it on the next import, e.g. .venv/bin/python -c 'import sys; sys.path.insert(0, \"src\"); import engine'"

  - path: work/frame.parquet
    keep: the 45,207-row frame joining four artifacts' saved generations; every paid label and every statistic is keyed to it

  - path: labels/
    keep: $4.31 of paid judge labels and the per-row readout table - not reproducible without spending again, and read by eval.py, src/rederive.py and the paper
