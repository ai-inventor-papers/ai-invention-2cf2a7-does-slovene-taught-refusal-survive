entries:
  - path: paper.pdf
    keep: compiled 12-page research paper, the primary output
  - path: paper.aux
    delete: regenerable
    source: "pdflatex -interaction=nonstopmode paper.tex"
  - path: paper.bbl
    delete: regenerable
    source: "pybtex paper.aux"
  - path: paper.blg
    delete: regenerable
    source: "pybtex paper.aux"
  - path: paper.log
    delete: regenerable
    source: "pdflatex -interaction=nonstopmode paper.tex"
  - path: paper.out
    delete: regenerable
    source: "pdflatex -interaction=nonstopmode paper.tex"
