entries:
  - path: .venv/
    delete: redownloadable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: work/master.parquet
    delete: regenerable
    source: "uv run src/build_master.py (rebuilds from exp8 results/items_final.jsonl)"
  - path: __pycache__/
    delete: regenerable
    source: "Python bytecode cache; regenerated on next `.venv/bin/python` run"
  - path: src/__pycache__/
    delete: regenerable
    source: "Python bytecode cache; regenerated on next `.venv/bin/python src/*.py` run"
