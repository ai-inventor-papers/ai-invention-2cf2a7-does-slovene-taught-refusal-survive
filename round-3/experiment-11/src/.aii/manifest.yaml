entries:
  - path: .venv/
    delete: regenerable
    source: "uv sync"
  - path: src/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall src tests"
  - path: tests/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall src tests"
  - path: .pytest_cache/
    delete: regenerable
    source: ".venv/bin/python -m pytest -c pytest.ini tests/"
