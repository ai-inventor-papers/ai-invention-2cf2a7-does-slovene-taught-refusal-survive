entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -r env/requirements.lock.txt"
  - path: .pytest_cache/
    delete: regenerable
    source: ".venv/bin/python -m pytest -q -c pytest.ini tests/"
  - path: adapters/
    keep: condition LoRA adapters (lambda-scaled + Heretic-built random-direction edits, both models) that gates.json cites by path+sha256 and later rounds load
