entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: src/__pycache__/
    delete: regenerable
    source: "python bytecode cache; recreated automatically on the next run of any src/ script"
  - path: tests/__pycache__/
    delete: regenerable
    source: "python bytecode cache; recreated automatically by .venv/bin/python -m pytest -q"
  - path: .pytest_cache/
    delete: regenerable
    source: "pytest run cache; recreated automatically by .venv/bin/python -m pytest -q"
