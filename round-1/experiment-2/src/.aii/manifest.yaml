entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cu128 --index-strategy unsafe-best-match"
  - path: src/__pycache__/
    delete: regenerable
    source: "python bytecode cache, recreated automatically on the next import (e.g. .venv/bin/python src/analyze.py)"
  - path: results/
    keep: per-item JSONL of ~4 GPU-hours of NF4 12B runs (4 checkpoints), directions, L22 residual split parts, judge labels; not cheaply reproducible
