entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.lock.txt"
  - path: results/directions/
    keep: per-layer persona/refusal/langid/random directions + mean residuals of both 12B models (GPU-derived, needed to rerun or extend the screen)
  - path: results/
    keep: per-item generations, s scores, judge labels, MC and analysis outputs from ~3 GPU-hours; the paper reads these
  - path: data/
    keep: RefusEU EN/SL train+test parquet, frozen splits, SL translations and identity items the protocol hashes refer to
  - path: src/__pycache__/
    delete: regenerable
    source: "python bytecode cache; recreated automatically by running any script, e.g. cd src && ../.venv/bin/python test_static.py"
