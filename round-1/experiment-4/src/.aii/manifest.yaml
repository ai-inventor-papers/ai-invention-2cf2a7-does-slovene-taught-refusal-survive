entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -r requirements.lock.txt"
  - path: results/gemma_it/
    keep: GPU per-item outputs, Heretic Optuna journal, selected LoRA adapter (~20 MB) and residual directions; ~2 GPU-hours, not reproducible inside this run
  - path: results/gams3_it/
    keep: GPU per-item outputs, Heretic Optuna journal, selected LoRA adapter (~20 MB) and residual directions; ~2 GPU-hours, not reproducible inside this run
  - path: results/smoke_gemma_it/
    keep: smoke-test outputs (2 trials) incl. a small LoRA adapter, referenced in README as pipeline validation evidence
  - path: __pycache__/
    delete: regenerable
    source: "python bytecode cache; recreated automatically on the next import (e.g. .venv/bin/python method.py)"
  - path: src/__pycache__/
    delete: regenerable
    source: "python bytecode cache; recreated automatically on the next import (e.g. .venv/bin/python method.py)"
